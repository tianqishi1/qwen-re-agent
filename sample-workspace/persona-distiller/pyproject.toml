[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-distiller"
version = "1.0.0"
description = "把某个人的文档、书籍、链接、经历与语录沉淀蒸馏成可反复使用的「人格 Skill」"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []          # 核心零第三方依赖；PDF 解析可选 pypdf

[project.scripts]
pd = "persona_distiller.cli:main"

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]

[tool.setuptools]
packages = ["persona_distiller"]
